<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Pending Approval - Lubowa Morph</title>
  <!-- Modern Premium Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      /* Premium Deep Blue Gradient matching the Morph portal */
      background: linear-gradient(135deg, #163A59 0%, #0D2235 50%, #06101A 100%);
      padding: 20px;
      overflow-x: hidden;
    }

    /* Entrance Animation for the Card */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Pulse Micro-animation for the Hourglass */
    @keyframes pulse {
      0% {
        transform: scale(1);
        filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.2));
      }
      50% {
        transform: scale(1.08);
        filter: drop-shadow(0 0 25px rgba(255, 255, 255, 0.5));
      }
      100% {
        transform: scale(1);
        filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.2));
      }
    }

    .main-container {
      width: 100%;
      max-width: 580px;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 45px 35px;
      text-align: center;
      box-shadow: 0 25px 55px rgba(0, 0, 0, 0.35);
      animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .logo-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 30px;
    }

    .logo-icon {
      height: 38px;
      width: auto;
      filter: brightness(0) invert(1);
    }

    .logo-text {
      font-family: 'Outfit', sans-serif;
      font-size: 1.45em;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    .status-icon {
      font-size: 4.8em;
      line-height: 1;
      margin-bottom: 25px;
      display: inline-block;
      cursor: default;
      animation: pulse 2.2s ease-in-out infinite;
    }

    .title {
      font-family: 'Outfit', sans-serif;
      font-size: 2em;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 16px;
      letter-spacing: -0.5px;
    }

    .description {
      color: rgba(255, 255, 255, 0.75);
      font-size: 1.05em;
      line-height: 1.65;
      margin-bottom: 35px;
    }

    .user-email-badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 16px;
      border-radius: 50px;
      color: #ffffff;
      font-weight: 600;
      font-size: 0.95em;
      margin: 8px 0;
      letter-spacing: 0.3px;
    }

    .action-divider {
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 30px;
      margin-top: 10px;
    }

    /* Premium Sign Out Button */
    .sign-out-btn {
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      padding: 15px 25px;
      font-size: 1.05em;
      font-weight: 600;
      border-radius: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .sign-out-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    }

    .sign-out-btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="main-container">
    <!-- Header Logo -->
    <div class="logo-container">
      <img src="vue/public/watoto.svg" alt="Watoto Logo" class="logo-icon" onerror="this.src='https://raw.githubusercontent.com/Watoto-Lubowa/LubowaMorphRegistration/main/vue/public/watoto.svg'">
      <span class="logo-text">Watoto Lubowa</span>
    </div>

    <!-- Animated Status Indicator -->
    <div class="status-icon">⏳</div>

    <!-- Details -->
    <h1 class="title">Access Pending Approval</h1>
    
    <p class="description">
      Your account <br>
      <span class="user-email-badge">assistant.lubowa@gmail.com</span> <br>
      is currently pending administrator authorization.
      <br><br>
      Please contact your system coordinator to authorize your access to the Morph registration portal.
    </p>

    <!-- Sign Out Button -->
    <div class="action-divider">
      <button class="sign-out-btn">
        <span>🚪</span> Sign Out / Use Different Account
      </button>
    </div>
  </div>

</body>
</html>
